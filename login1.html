<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login1</title>
    <link rel="stylesheet" href="login1.css">
    <link href="https://fonts.font.im/css?family=Dancing+Script" rel="stylesheet">
</head>
<body>
    <div class="bg-image"></div>
    <div class="logo"></div>
    <div class="title1">清除缓存</div>
    <div class="title2">网络检查</div>
    <div class="backvideo">
        <video loop id="myvideo">
            <source src="./video/Arknights.mp4" type="video/mp4">
        </video>
        
    </div>
    <div id="progress-container">
        <div class="progress-bar" id="progressBar">
            <div class="text" id="text">0%</div>
        </div>
    </div>
    <div id="start" style="display: none;">start</div>
    
</body>
<script src="loading.js"></script>
<script>
     document.getElementById('start').addEventListener('click', function() {
    window.location.href = 'login2.html';
});
</script>
<script>
     var images = [
    'url("./gallery/loginbg1.jpg")',
    'url("./gallery/loginbg2.jpg")',
    'url("./gallery/loginbg3.jpg")',
    // 更多图片...
  ];

  // 是否已经播放完一轮
  var hasPlayedOnce = false;

  // 改变背景图片的函数
  function changeBackground() {
    if (hasPlayedOnce) {
      // 如果已经播放完一轮，不再更换背景图片
      document.querySelector('.bg-image').style.display = 'none';
      return;
    }

    var imgIndex = images.length > 0 ? images.shift() : ''; // 移除并获取第一个图片
    if (imgIndex) {
      document.querySelector('.bg-image').style.backgroundImage = imgIndex;
    } else {
      // 如果没有图片了，设置标志为 true
      hasPlayedOnce = true;
    }
  }

 
  setInterval(changeBackground, 3000);

  changeBackground(); 


</script>
<script>
  window.onload = function() {
  var video = document.getElementById('myvideo');
  setTimeout(function() {
    video.play();
  }, 6000); 
};
</script>
</html>
